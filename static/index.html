<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>写真で献立提案システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.1em;
            color: #667eea;
            margin-bottom: 10px;
        }

        .upload-hint {
            font-size: 0.9em;
            color: #999;
        }

        #fileInput {
            display: none;
        }

        .preview-area {
            margin-top: 20px;
            text-align: center;
        }

        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-area {
            margin-top: 30px;
            padding: 25px;
            background: #f8f9ff;
            border-radius: 15px;
            display: none;
        }

        .result-area.active {
            display: block;
        }

        .result-title {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .result-content {
            background: white;
            padding: 0;
            border-radius: 10px;
            color: #333;
        }

        .menu-section {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9ff;
            border-radius: 12px;
            border-left: 5px solid #667eea;
        }

        .menu-section:last-child {
            margin-bottom: 0;
        }

        /* 献立セクションを特に目立たせる */
        .menu-section:has(.main-dish) {
            background: linear-gradient(135deg, #fff5f5 0%, #f8f9ff 100%);
            border-left-color: #ff6b6b;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.2);
        }

        .section-title {
            font-size: 1.6em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* 献立セクションのタイトルを強調 */
        .menu-section:has(.main-dish) .section-title {
            background: linear-gradient(135deg, #ffe0e0 0%, #ffffff 100%);
            color: #ff6b6b;
            font-size: 1.8em;
        }

        .ingredient-list {
            list-style: none;
            padding: 0;
            margin: 10px 0;
        }

        .ingredient-list li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
            line-height: 1.6;
        }

        .ingredient-list li:before {
            content: "🥬";
            position: absolute;
            left: 0;
        }

        .dish-card {
            background: white;
            padding: 25px;
            margin: 25px 0;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .dish-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        /* メイン料理のスタイル */
        .dish-card.main-dish {
            border: 3px solid #ff6b6b;
            background: linear-gradient(135deg, #fff5f5 0%, #ffffff 100%);
        }

        .dish-card.main-dish .dish-title {
            font-size: 2.2em;
            color: #ff6b6b;
            background: linear-gradient(135deg, #ffe0e0 0%, #fff5f5 100%);
            border-left: 6px solid #ff6b6b;
            padding: 18px;
            margin-bottom: 20px;
        }

        /* 副菜のスタイル */
        .dish-card.side-dish {
            border: 3px solid #4ecdc4;
            background: linear-gradient(135deg, #f0fffe 0%, #ffffff 100%);
        }

        .dish-card.side-dish .dish-title {
            font-size: 1.9em;
            color: #4ecdc4;
            background: linear-gradient(135deg, #e0fffe 0%, #f0fffe 100%);
            border-left: 6px solid #4ecdc4;
            padding: 16px;
            margin-bottom: 18px;
        }

        /* 汁物のスタイル */
        .dish-card.soup-dish {
            border: 3px solid #95a5a6;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
        }

        .dish-card.soup-dish .dish-title {
            font-size: 1.9em;
            color: #7f8c8d;
            background: linear-gradient(135deg, #ecf0f1 0%, #f8f9fa 100%);
            border-left: 6px solid #95a5a6;
            padding: 16px;
            margin-bottom: 18px;
        }

        /* デフォルトのタイトルスタイル */
        .dish-title {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 10px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .dish-info {
            margin: 15px 0;
            padding: 12px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            border-left: 3px solid #ddd;
        }

        .main-dish .dish-info {
            border-left-color: #ff6b6b;
        }

        .side-dish .dish-info {
            border-left-color: #4ecdc4;
        }

        .soup-dish .dish-info {
            border-left-color: #95a5a6;
        }

        .dish-info-label {
            font-weight: bold;
            font-size: 1.1em;
            margin-right: 8px;
            display: inline-block;
            min-width: 100px;
        }

        .main-dish .dish-info-label {
            color: #ff6b6b;
        }

        .side-dish .dish-info-label {
            color: #4ecdc4;
        }

        .soup-dish .dish-info-label {
            color: #7f8c8d;
        }

        .dish-info-content {
            color: #333;
            line-height: 1.8;
            font-size: 1.05em;
        }

        .point-list {
            list-style: none;
            padding: 0;
            margin: 10px 0;
        }

        .point-list li {
            padding: 6px 0;
            padding-left: 25px;
            position: relative;
            line-height: 1.6;
        }

        .point-list li:before {
            content: "✨";
            position: absolute;
            left: 0;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 写真で献立提案</h1>
            <p>冷蔵庫の写真を撮るだけで、今日の献立を提案します</p>
        </div>

        <div class="content">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📷</div>
                <div class="upload-text">写真をドラッグ&ドロップ または クリックして選択</div>
                <div class="upload-hint">PNG, JPG, JPEG, GIF, WEBP形式に対応</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <div class="preview-area" id="previewArea" style="display: none;">
                <img id="previewImage" class="preview-image" alt="プレビュー">
                <br>
                <button class="btn" id="generateBtn">献立を生成する</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>AIが献立を考えています...</p>
            </div>

            <div class="error" id="error"></div>

            <div class="result-area" id="resultArea">
                <div class="result-title">✨ 提案された献立</div>
                <div class="result-content" id="resultContent"></div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewArea = document.getElementById('previewArea');
        const previewImage = document.getElementById('previewImage');
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const resultArea = document.getElementById('resultArea');
        const resultContent = document.getElementById('resultContent');
        const errorDiv = document.getElementById('error');

        let selectedFile = null;

        // クリックでファイル選択
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // ドラッグ&ドロップ
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // ファイル選択
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // ファイル処理
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('画像ファイルを選択してください');
                return;
            }

            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewArea.style.display = 'block';
                resultArea.classList.remove('active');
                errorDiv.classList.remove('active');
            };
            reader.readAsDataURL(file);
        }

        // 献立生成
        generateBtn.addEventListener('click', async () => {
            if (!selectedFile) {
                showError('画像を選択してください');
                return;
            }

            loading.classList.add('active');
            generateBtn.disabled = true;
            resultArea.classList.remove('active');
            errorDiv.classList.remove('active');

            const formData = new FormData();
            formData.append('image', selectedFile);

            try {
                const response = await fetch('/api/generate-menu', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    resultContent.innerHTML = formatMenuText(data.menu);
                    resultArea.classList.add('active');
                    // 結果表示時にスクロール
                    resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    showError(data.error || '献立生成に失敗しました');
                }
            } catch (error) {
                showError('エラーが発生しました: ' + error.message);
            } finally {
                loading.classList.remove('active');
                generateBtn.disabled = false;
            }
        });

        // エラー表示
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
        }

        // 献立テキストをHTMLに変換
        function formatMenuText(text) {
            let html = '';
            const lines = text.split('\n');
            let currentSection = null;
            let currentDish = null;
            let inList = false;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                // 空行はスキップ
                if (!line) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    continue;
                }

                // セクション見出し（【】で囲まれた部分）
                if (line.match(/^【(.+)】$/)) {
                    if (currentSection) {
                        html += '</div>';
                    }
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const sectionName = line.match(/^【(.+)】$/)[1];
                    currentSection = sectionName;
                    html += `<div class="menu-section">`;
                    html += `<div class="section-title">${getSectionIcon(sectionName)} ${sectionName}</div>`;
                    continue;
                }

                // 料理番号（1. メイン料理: など）
                if (line.match(/^\d+\.\s*(.+?):\s*(.+)$/)) {
                    if (currentDish) {
                        html += '</div>';
                    }
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = line.match(/^\d+\.\s*(.+?):\s*(.+)$/);
                    const dishType = match[1];
                    const dishName = match[2];
                    currentDish = dishName;
                    
                    // 料理タイプに応じたクラスを追加
                    let dishClass = '';
                    if (dishType.includes('メイン')) {
                        dishClass = 'main-dish';
                    } else if (dishType.includes('副菜')) {
                        dishClass = 'side-dish';
                    } else if (dishType.includes('汁物') || dishType.includes('スープ')) {
                        dishClass = 'soup-dish';
                    }
                    
                    html += `<div class="dish-card ${dishClass}">`;
                    html += `<div class="dish-title">${getDishIcon(dishType)} ${dishName}</div>`;
                    continue;
                }

                // 材料や作り方のラベル（- 材料: など）
                if (line.match(/^-\s*(材料|簡単な作り方|作り方):\s*(.+)$/)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = line.match(/^-\s*(材料|簡単な作り方|作り方):\s*(.+)$/);
                    html += `<div class="dish-info">`;
                    html += `<span class="dish-info-label">${match[1]}:</span>`;
                    html += `<span class="dish-info-content">${match[2]}</span>`;
                    html += `</div>`;
                    continue;
                }

                // リスト項目（- で始まる行）
                if (line.startsWith('- ')) {
                    if (!inList) {
                        html += '<ul class="ingredient-list">';
                        inList = true;
                    }
                    const content = line.substring(2);
                    html += `<li>${content}</li>`;
                    continue;
                }

                // ポイント（【ポイント】セクション内のリスト）
                if (currentSection && currentSection.includes('ポイント') && line.startsWith('- ')) {
                    if (!inList) {
                        html += '<ul class="point-list">';
                        inList = true;
                    }
                    const content = line.substring(2);
                    html += `<li>${content}</li>`;
                    continue;
                }

                // その他のテキスト
                if (inList && !line.startsWith('-')) {
                    html += '</ul>';
                    inList = false;
                }
                html += `<p style="margin: 8px 0; line-height: 1.7;">${line}</p>`;
            }

            // 閉じタグ
            if (inList) {
                html += '</ul>';
            }
            if (currentDish) {
                html += '</div>';
            }
            if (currentSection) {
                html += '</div>';
            }

            return html;
        }

        // セクションアイコンを取得
        function getSectionIcon(sectionName) {
            const icons = {
                '認識した食材': '🔍',
                '提案する献立': '🍽️',
                'ポイント': '💡',
                'ポイント': '✨'
            };
            return icons[sectionName] || '📋';
        }

        // 料理タイプのアイコンを取得
        function getDishIcon(dishType) {
            const icons = {
                'メイン料理': '🍖',
                '副菜': '🥗',
                '汁物': '🍲',
                '主食': '🍚',
                'デザート': '🍰'
            };
            return icons[dishType] || '🍽️';
        }
    </script>
</body>
</html>
